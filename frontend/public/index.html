<!DOCTYPE html>
<!--
  Gabarit HTML de la web app. Avec "web.output": "single" (app.json), Expo sert
  CE fichier et ignore app/+html.tsx. C'est la seule source des métadonnées
  lues par les moteurs et les réseaux sociaux, qui n'exécutent pas le JavaScript.
  Icônes et image de partage : générées par scripts/gen_icones.py.
-->
<html lang="fr" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover : l'app occupe tout l'écran (encoche, barre d'accueil) ; les
         marges des safe areas sont appliquées par l'app (react-native-safe-area-context). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pinkberry Drc</title>
    <meta
      name="description"
      content="Commandez vos yogourts glacés Pinkberry à Kinshasa : catalogue, paiement à la livraison et suivi de livraison en direct."
    />

    <!-- Icônes -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icones/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icones/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icones/icon-180.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Couleur des barres système = fond de l'en-tête, en clair et en sombre.
         Mise à jour à l'exécution quand l'utilisateur force un thème (src/web-pwa.ts). -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241820" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pinkberry" />

    <!--
      Partage (Open Graph / X). L'image doit être une URL absolue : les robots
      n'exécutent pas le JavaScript. À mettre à jour si le domaine public change
      (même valeur que EXPO_PUBLIC_SITE_URL).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pinkberry Drc" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://pinkberrydrc.app" />
    <meta property="og:title" content="Pinkberry Drc" />
    <meta
      property="og:description"
      content="Commandez vos yogourts glacés Pinkberry à Kinshasa, avec paiement à la livraison et suivi en direct."
    />
    <meta property="og:image" content="https://pinkberrydrc.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Pinkberry" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pinkberry Drc" />
    <meta
      name="twitter:description"
      content="Commandez vos yogourts glacés Pinkberry à Kinshasa, avec paiement à la livraison."
    />
    <meta name="twitter:image" content="https://pinkberrydrc.app/og-image.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="pinkberry-base">
      /* Hauteur dynamique : suit les barres mobiles de Safari / Chrome (pas de saut). */
      @supports (height: 100dvh) {
        html, body, #root { height: 100dvh; }
      }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      html, body { overflow-x: hidden; overscroll-behavior-y: none; background: #FBF6F9; }
      body { -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #1A1016; }
      }
      /* Interrupteurs (Switch) : zone tactile de 48×44 px autour du visuel de 40×20 px.
         L'input natif est invisible et superposé : on l'agrandit sans rien déplacer. */
      input[role="switch"] {
        top: -12px !important;
        left: -4px !important;
        width: calc(100% + 8px) !important;
        height: calc(100% + 24px) !important;
      }
      /* Médias jamais plus larges que leur conteneur. */
      img, video, canvas { max-width: 100%; }
      /* iOS zoome sur un champ dont le texte fait moins de 16 px : on l'évite sur mobile. */
      @media (max-width: 640px) {
        input, textarea, select { font-size: 16px !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }
    </style>
  </head>

  <body>
    <noscript>Activez JavaScript pour utiliser Pinkberry. · Enable JavaScript to use Pinkberry.</noscript>
    <div id="root"></div>
  </body>
</html>
